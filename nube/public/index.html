<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Súper · Nube</title>
<link rel="icon" href="/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilos.css">
<script type="module" src="/js/panel.js"></script>
</head>
<body>
<section id="login" class="login oculto">
  <form id="f-login" class="panel" novalidate>
    <div class="marca"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg></span>Mini Súper · Nube</div>
    <p class="muted">Consulta en línea de tus tiendas.</p>
    <label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña<input name="contrasena" type="password" autocomplete="current-password" required></label>
    <p class="error-form" id="error-login" role="alert"></p>
    <button type="submit" class="primario">Entrar</button>
  </form>
</section>

<div id="app" class="oculto">
  <header class="barra">
    <span class="marca"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg></span>Nube</span>
    <button id="menu-boton" class="menu-boton" type="button" aria-expanded="false" aria-controls="menu-panel">Menú</button>
    <div class="menu-panel" id="menu-panel">
    <nav id="menu" aria-label="Secciones">
      <a href="#resumen" data-seccion="resumen">Resumen</a>
      <a href="#ventas" data-seccion="ventas">Ventas</a>
      <a href="#inventario" data-seccion="inventario">Inventario</a>
      <a href="#nomina" data-seccion="nomina">Nómina</a>
      <a href="#cajas" data-seccion="cajas">Cortes de caja</a>
      <a href="#usb" data-seccion="usb">Cargar USB</a>
    </nav>
    <div class="sesion">
      <label class="oculto-etiqueta">Tienda<select id="tienda" aria-label="Tienda"></select></label>
      <span id="usuario-actual"></span>
      <button id="salir" class="chico" type="button">Salir</button>
    </div>
    </div>
  </header>

  <main id="vista"></main>
</div>
<div id="avisos" aria-live="polite"></div>
<dialog id="dialogo"><div class="contenido" id="dialogo-contenido"></div></dialog>
</body>
</html>
