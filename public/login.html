<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Súper · Iniciar sesión</title>
<link rel="icon" href="/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilos.css">
<script type="module" src="/js/login.js"></script>
</head>
<body>
<main class="login">
  <form id="f-login" class="panel" novalidate>
    <div class="marca">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg></span>
      <span id="nombre-tienda">Mini Súper</span>
    </div>
    <h1><span class="acento">Bienvenido</span> de nuevo</h1>
    <p class="muted">Inicia sesión para continuar.</p>
    <label>Usuario
      <input name="usuario" autocomplete="username" required autofocus>
    </label>
    <label>Contraseña
      <input name="contrasena" type="password" autocomplete="current-password" required>
    </label>
    <p id="error" class="error-form" role="alert"></p>
    <button class="primario" type="submit">Entrar</button>
  </form>
</main>
</body>
</html>
