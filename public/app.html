<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Súper</title>
<link rel="icon" href="/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/estilos.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<header class="barra">
  <a class="marca" href="#venta">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg></span>
    <span id="nombre-tienda">Mini Súper</span>
  </a>
  <span id="estado-caja"></span>
  <button id="menu-boton" class="menu-boton" type="button" aria-expanded="false" aria-controls="menu-panel">Menú</button>
  <!-- En computadora no se nota este contenedor; en el celular es la tarjeta del menú al centro. -->
  <div class="menu-panel" id="menu-panel">
    <nav id="menu" aria-label="Secciones"></nav>
    <div class="sesion">
      <span id="usuario-actual"></span>
      <a href="#cuenta">Mi cuenta</a>
      <button id="salir" class="chico" type="button">Salir</button>
    </div>
  </div>

</header>
<main id="vista" tabindex="-1"></main>
<div id="avisos" aria-live="polite"></div>
<dialog id="dialogo"><div class="contenido" id="dialogo-contenido"></div></dialog>
</body>
</html>
